name: Go CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only HEAD^ HEAD -- '*.go')
          if ((${#files[@]})); then
            unformatted=$(gofmt -l "${files[@]}")
          else
            unformatted=""
          fi
          if [[ -n "$unformatted" ]]; then
            printf 'Changed Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Windows AMD64 cross-build
        run: go build ./...
        env:
          GOOS: windows
          GOARCH: amd64
